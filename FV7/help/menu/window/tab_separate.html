<h2>タブを分離</h2>
<p>現在表示しているフォルダ タブをタブ バーから分離して、新しいウィンドウで開きなおします。</p>
<div class="info1">
	VISTA以降のオペレーティング システムでは、このメニューを<KBD>Ctrl</KBD>キーを押下しながら実行すると
	新しいウィンドウは「管理者権限」が付加されます。
</div>
