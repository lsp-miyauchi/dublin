<h2>最新の情報に更新</h2>
<p>FileVisorでは、ファイル一覧に表示されているドライブやフォルダの内容が常に検索されているため、操作のたびにその内容は更新されています。しかし、フロッピーディスクの入れ替えは検知されません。</p>
<p>このようなときは、このコマンドを実行してファイル一覧の情報を更新します。</p>
