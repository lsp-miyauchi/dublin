<h2>ショートカットの貼付け</h2>
<p>コピーあるいは切り取られたファイルオブジェクトへのショートカットを現在の場所に貼付けます。なお、この操作により、切り取り指定されたファイルオブジェクトが削除されることはありません。</p>
<p>この機能は<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Ins</kbd>に割り当てられています。</p>
