<h2>ボリュームラベル</h2>
<p>ディスクのボリュームラベル（ディスクの名前）の変更をおこないます。</p>
<p>ディスクがFAT/FAT32ファイルシステムでフォーマットされているときは、ラベル名は半角文字で１１文字以内、ディスクがNTFSファイルシステムでフォーマットされているときは、ラベル名は半角文字で３２文字以内です。</p>
