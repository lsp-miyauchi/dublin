<h2>ディスクコピー</h2>
<p>システムがもつ機能を利用して、フロッピーディスクをコピー（複製）します。この機能を実行する場合には、コピーする側とされる側のディスク容量が等しくなければなりません。また、コピーをおこなうとコピーされる側の以前のディスク内容はすべて消去されます。</p>
