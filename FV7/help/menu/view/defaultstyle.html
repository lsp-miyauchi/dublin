<h2>基本の表示スタイルを更新</h2>
<p>現在のフォルダの表示形式やアイコンの大きさ・ソート方法などのスタイルを、
基本の表示スタイルとして登録します。</p>
<p>過去に表示したことがない新しいフォルダの場合などは
この基本スタイルでフォルダ内容が表示されます。</p>
