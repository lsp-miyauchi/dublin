<h2>システムフォルダ</h2>
<p>Windowsには、システムに関連する種々のフォルダがあり、これらのフォルダへ簡単にアクセスするためのメニューです。 
このシステムフォルダには、「デスクトップ」「送る」「お気に入り」「スタートメニュー」「パーソナル」など、たくさんのフォルダがあります。</p>
