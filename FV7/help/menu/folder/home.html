<h2>ホーム</h2>
<p>ホームフォルダとして登録したフォルダを開きます。
フォルダが設定されていない場合には、「マイ ドキュメント」が開かれます。</p>
<div class="info1">
	ホームフォルダを登録するには、［ツール］ メニューの
	「オプション」を選択して表示される設定画面の
	「起動」タブからホームフォルダを登録できます。
</div>
