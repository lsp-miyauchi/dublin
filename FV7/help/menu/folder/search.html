<h2>検索</h2>
<p>単独あるいは複数の条件に一致するファイルやフォルダを指定のドライブやフォルダから検索します。</p>
<p>検索に際して、ファイルのサイズや作成・更新日時などの検索オプションも指定可能です。</p>
