<h2>履歴</h2>
<p>過去にアクセスしたフォルダでファイル操作をおこなった場合、当該フォルダを 
アクセスの履歴として覚えておき、履歴のメニューを表示して過去にアクセスした 
フォルダに直接戻るコマンドです。
履歴メニューの最後にある「履歴のクリア」コマンドで、この履歴はいつでも初期化
することができます。</p>
