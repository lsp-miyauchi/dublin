<h2>属性の変更</h2>
<p>ファイルの作成日時・更新日付や属性を変更します。</p>
<p>フォルダを対象にした場合には、そのフォルダの階層下のファイルやフォルダの日付や属性変更も一括しておこなうことができます。</p>
