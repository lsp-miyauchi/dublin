<h2>関連付け</h2>
<p>ファイルの拡張子に対して特定のアプリケーションを関連付けます。
これにより特定のファイルをダブルクリックした際に、
そのファイルを開くアプリケーションや、
表示するアイコンを変更することが可能です。</p>
