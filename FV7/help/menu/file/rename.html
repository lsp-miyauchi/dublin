<h2>名前の変更</h2>
<p>ファイルやフォルダを変更します。</p>

<div class="info1">
	ファイル名に利用する文字は大文字小文字が表記上では区別されます（検索上では区別されません）。<br>
	例えば “ABCD.EFG” という名前を “ABcd.Efg” にリネームすることも可能です。
