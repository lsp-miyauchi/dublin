<h2>一括削除</h2>
<p>ファイルやフォルダ配下の、指定された条件に一致するファイルを削除します。
例えば “~*.tmp”（ワイルドカード）や “~.*\.tmp$”（正規表現） などの特定のファイルを一気に削除する場合に役立ちます。</p>
