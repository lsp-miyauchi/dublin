<h2>フォルダ間で内容の同期をとる</h2>
<p>２つのフォルダ間で内容の同期をとるには、「フォルダの同期」機能を利用します。
<p>例えば、あるフォルダをバックアップしたいときや、
ネットワークで接続された他のコンピュータ上のフォルダと常に内容を同一に保ちたいときなどに利用します。</p>
